name: Generate 3 rejected savanna model replacements
on:
  push:
    tags: [meshy-savanna-revisions-20260921-v1]
permissions:
  contents: read
concurrency:
  group: meshy-savanna-revisions-20260921-v1
  cancel-in-progress: false
jobs:
  generate:
    # Keep this tag immutable. Reruns must not start a second paid batch.
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: MESHY_API_KEY
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Validate all 3 committed references without API access
        run: node scripts/generate-savanna-revisions.mjs --dry-run
      - name: Generate 3 image-guided models and review thumbnails
        timeout-minutes: 50
        env:
          MESHY_API_KEY: ${{ secrets.MESHY_API_KEY }}
        run: node scripts/generate-savanna-revisions.mjs
      - name: Preserve models, thumbnails, receipts, and resumable task IDs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: meshy-savanna-revisions
          path: generated/savanna-revisions/
          retention-days: 30
          if-no-files-found: warn
